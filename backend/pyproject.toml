[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldbrief"
version = "0.1.0"
description = "World Brief backend: local news pipeline and private API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "feedparser>=6.0",
    "jsonschema>=4.21",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
worldbrief = "worldbrief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
worldbrief = ["briefing.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
